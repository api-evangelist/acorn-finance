- name: LoanApplication
  description: >-
    A consumer's financing application, attributed to a dealer id and a company. Read
    only through GET /company_applications; the partner API cannot create one — an
    application is created by the applicant in Acorn's hosted flow.
  id_field: application_id
  id_type: integer
  created_by: hosted application flow (not an API operation)
  fields:
  - application_id
  - created_at
  - loan_status
  - first_name
  - last_name
  - email
  - phonenumber
  - state
  - zip
  - offer_count
  - loanamount
  - cb_indicator
  - funded_partner
  - funded_date
  - funded_amount
  - lender
  - rep_first_name
  - rep_last_name
