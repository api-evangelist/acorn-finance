- name: PartnerPostback
  description: >-
    The event payload Acorn POSTs to a partner-hosted URL on an application status
    change, and the reply the partner returns.
  id_field: applicationId
  relationships:
  - type: belongs_to
    target: LoanApplication
    via: applicationId
  - type: belongs_to
    target: AppCompanyUser
    via: dealerId
  docs: https://docs.acornfinance.com/api-postback
identifier_conventions:
  dealer_id:
    shape: '<PREFIX>-<partner suffix>'
    detail: >-
      Acorn assigns each partner a prefix (documented example QRS-) and the partner
      appends a unique suffix. Some dealer ids in the documentation are unprefixed
      five-character codes (IY86O, QR19I, VK81M), which appear to be a legacy or
      self-service form.
  utm_content:
    detail: >-
      Documented as the partner's own estimate/invoice/document id. It is the practical
      foreign key from an Acorn application back to a record in the partner's system,
      and it is echoed on the postback as partnerId.
