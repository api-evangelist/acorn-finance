  - parent_company_name
  - dealer_id
  - user_kind
  - app_company_parent_id
  - utm_source
  - utm_campaign
  - utm_medium
  - utm_term
  - utm_content
  enumerations:
    loan_status:
    - NO OFFER
    - OFFERED
    - SELECTED
    - FUNDED
    - EXPIRED
  relationships:
  - type: belongs_to
    target: AppCompanyUser
    via: dealer_id
  - type: belongs_to
    target: AppCompany
    via: company_name / app_company_parent_id
    note: >-
      The application record references the company by name and parent id rather than
      by the numeric company id, even though the collection can be FILTERED by cid.
  docs: https://docs.acornfinance.com/api-applications
