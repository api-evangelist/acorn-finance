note: >-
  Derived from the request and response bodies Acorn Finance publishes verbatim in its
  partner documentation. There is no OpenAPI document and no components/schemas block
  to read, so field lists are transcribed from documented examples and are complete
  only to the extent the examples are. Field values from the documentation's examples
  (which contain sample personal names, emails and phone numbers) are deliberately not
  reproduced here.
