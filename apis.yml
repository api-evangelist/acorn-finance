apis:
- aid: acorn-finance:acorn-finance-partner-api
  name: Acorn Finance Partner API
  description: The Acorn Finance partner REST API. Basic-authenticated JSON endpoints on api.acornfinance.com
    let point-of-sale and contractor-software partners create companies and company users, retrieve loan
    application status, rotate API credentials, and request the lowest monthly payment amount (and a hosted
    loan application URL) for a given loan amount, project sub-purpose and location. A UAT environment
    is published at uat.api.acornfinance.com.
