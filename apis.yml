aid: acorn-finance
name: Acorn Finance
description: Acorn Finance, operated by Headway Sales Inc. (NMLS ID# 1817022) of Sacramento, California,
  runs an embedded lending marketplace for home improvement and business financing. Consumers pre-qualify
  for personal loans of $1,000 to $100,000 through a soft credit pull and compare offers from a network
  of lending partners, while contractors, dealers and point-of-sale software vendors embed those offers
  into estimates, invoices, quotes, carts and PDFs. Acorn Finance publishes a public partner developer
  program at docs.acornfinance.com covering a Basic-authenticated REST API on api.acornfinance.com (company
  and user provisioning, loan application retrieval, API key rotation and lowest-payment-amount quoting),
  a partner postback webhook, and a family of embeddable JavaScript widgets served from widgets-cdn.acornfinance.com.
