note: >-
  Acorn Finance publishes NO client SDK in any public package registry. npm, PyPI,
  RubyGems, crates.io, Packagist, NuGet, Maven Central and pkg.go.dev were searched
  for "acorn-finance" / "acornfinance" and returned nothing first-party (npm results
  are all for the unrelated `acorn` JavaScript parser). Its GitHub organisation,
  github.com/headwaysales ("Acorn Finance", Sacramento CA), exists but publishes zero
  public repositories. Everything Acorn distributes to integrators is a browser bundle
  served from its own CDN, so `registry: cdn` applies throughout and there is no
  metadata endpoint to query for a version — the versions below are read from the URL
  path where the provider pins one, and from the CDN's Last-Modified header otherwise.
  No `SDKs` pointer is emitted because Acorn ships no API client library.
