credential_lifecycle:
  rotation_interval_days: 90
  discovery_endpoint: GET /active_credentials
  expiry_field: expires_on
  detail: >-
    Credentials carry created_at and expires_on and are rotated every 90 days. This
    is the only recurring lifecycle event the provider publishes and the only place
    the API returns a forward-looking date.
  evidence: https://docs.acornfinance.com/api-active-credential
application_lifecycle:
  states:
  - NO OFFER
  - OFFERED
  - SELECTED
  - FUNDED
  - EXPIRED
  detail: >-
    Loan applications move through a fixed status set, surfaced as loan_status on
    GET /company_applications and as processStatus on the partner postback. EXPIRED
    is a terminal state, but no expiry window is published.
  evidence: https://docs.acornfinance.com/api-applications
